# # Training settings for VQ-VAE stage

# data:
#   dataset: cifar10
#   root: ./data
#   image_size: 32
#   batch_size: 128
#   num_workers: 4

model:
  in_channels: 3
  num_hiddens: 128
  num_residual_hiddens: 32
  num_residual_layers: 2
  
  # Increased capacity for faces
  embedding_dim: 256    # Was 64. Crucial for feature richness.
  num_embeddings: 1024  # Was 512. More "words" for the model to use.
  
  commitment_cost: 0.25
  decay: 0.99           # EMA Decay

training:
  batch_size: 128
  learning_rate: 0.001
  max_iters: 50000      # Faces need fewer iters than ImageNet
  log_interval: 100
  save_interval: 1000


