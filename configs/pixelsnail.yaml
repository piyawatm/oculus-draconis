model:
  name: PixelSNAILPrior
  vocab_size: 1025        # 1024 embeddings + 1 BOS
  d_model: 256
  n_layer: 12
  height: 16              # FFHQ latent grid
  width: 16
  block_size: 257         # = 256 tokens + BOS
  n_residual: 4
  dropout: 0.3
  tie_embeddings: true

  attn_every: 4
  attn_key_dim: 32
  attn_val_dim: 64
  attn_heads: 4

train:
  epochs: 5
  batch_size: 16
  lr: 3e-4
  clip_grad: 1.0
  seed: 42
  save_path: checkpoints/pixelsnail_prior.pt
