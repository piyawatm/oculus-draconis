model:
  # VQ-VAE has 1024 codes. We set vocab_size = 1025 (0-1023 = codes, 1024 = BOS)
  vocab_size: 1025      
  block_size: 256       
  n_layer: 16           
  d_model: 256          
  n_head: 8
  latent_dim: 1024      
  dropout: 0.1
  radius: 3


training:
  batch_size: 64
  learning_rate: 0.0003
  max_iters: 100000
  warmup_iters: 1000
  log_interval: 100
  save_interval: 5000
