# BDH prior over VQ-VAE codes
model:
  name: BDHPrior
  vocab_size: 513
  d_model: 512
  n_layer: 16
  n_head: 8
  block_size: 65
  mlp_internal_dim_multiplier: 16   # controls latent N
  dropout: 0.1


train:
  epochs: 30
  batch_size: 128
  lr: 0.0003
  clip_grad: 1.0
  seed: 42
  save_path: checkpoints/bdh_prior.pt
