# BDH prior over VQ-VAE codes
model:
  name: BDHPrior
  vocab_size: 513
  d_model: 256
  n_layer: 6
  n_head: 4
  block_size: 65
  mlp_internal_dim_multiplier: 128
  dropout: 0.1
  image_height: 8
  image_width: 8
  locality_radius: 3
  use_softmax_attn: true     # NEW: Vision-BDH v2-style softmax in attention

train:
  epochs: 30                 # or 30 with best-checkpoint logic
  batch_size: 128
  lr: 0.0001                 # I’d reduce from 0.0003 for stability
  clip_grad: 1.0
  seed: 42
  save_path: checkpoints/bdh_prior.pt
  # optionally also add:
  # weight_decay: 0.01
  # label_smoothing: 0.1
  # schedule: cosine
